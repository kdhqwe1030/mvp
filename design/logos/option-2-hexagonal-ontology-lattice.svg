<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Option 2 - Hexagonal Ontology Lattice</title>
  <!-- 중심 → 꼭짓점 스포크 -->
  <g stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round">
    <path d="M32 32 L32 8"/>
    <path d="M32 32 L52.78 20"/>
    <path d="M32 32 L52.78 44"/>
    <path d="M32 32 L32 56"/>
    <path d="M32 32 L11.22 44"/>
    <path d="M32 32 L11.22 20"/>
  </g>
  <!-- 온톨로지 삼각 격자 -->
  <path d="M32 8 L52.78 44 L11.22 44 Z" stroke="#F37321" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- 외곽 헥사곤 -->
  <path d="M32 8 L52.78 20 L52.78 44 L32 56 L11.22 44 L11.22 20 Z" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- 꼭짓점: 부서 · 플랫폼 · 데이터 민감도 -->
  <circle cx="32" cy="8" r="3.4" fill="#F37321"/>
  <circle cx="52.78" cy="20" r="2.8" fill="#1E293B"/>
  <circle cx="52.78" cy="44" r="3.4" fill="#F37321"/>
  <circle cx="32" cy="56" r="2.8" fill="#1E293B"/>
  <circle cx="11.22" cy="44" r="3.4" fill="#F37321"/>
  <circle cx="11.22" cy="20" r="2.8" fill="#1E293B"/>
  <circle cx="32" cy="32" r="5" fill="#E1002A"/>
  <circle cx="32" cy="32" r="1.8" fill="#FFFFFF"/>
</svg>
